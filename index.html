<template id="article-beginnings" data-slug="beginnings" data-title="Beginnings: Complete Walkthrough Guide" data-desc="From waking up in a ventilation duct to opening the stuck door of the Captain&#x27;s Room."><h2>PREREQUISITE</h2>
<p>There are no requirements: this is the game's opening sequence and it starts automatically when you begin a new game. The game starts in Normal mode; you can change the difficulty at any time in the options menu.</p>
<hr>
<h2>PHASE 1: THE VENTILATION DUCT</h2>
<h4>STEP 1: WAKE UP</h4>
<p>You wake up naked in complete darkness, with no memory of who you are, trapped inside a metal ventilation duct. Only the sound of a fan answers your calls.</p>
<h4>STEP 2: ESCAPE THE DUCT</h4>
<p>Select <b>Explore</b> to crawl through the duct until you find a grate with a faint light below it.</p>
<p><b>Punch it</b> and then <b>Insist</b> twice: on the third blow the grate opens and you fall into the Captain's Room. <em>Outcome:</em> <b>-5 Health</b> from the fall.</p>
<hr>
<h2>PHASE 2: WHO ARE YOU?</h2>
<h4>STEP 1: THE MIRROR</h4>
<p>As the lights turn on, the main character walks to the <b>mirror</b>. They don't recognize the person in front of them: they have lost their memory. This starts the adventure <b>Find Out Who You Are</b>.</p>
<h4>STEP 2: CUSTOMIZE YOUR CHARACTER</h4>
<p>The character configuration screen opens. Choose your body, genitalia, eye color, hair style and color, skin tone, body hair, beard and pronouns. These choices shape descriptions and scenes throughout the whole game.</p>
<hr>
<h2>PHASE 3: EXPLORE THE CAPTAIN'S ROOM</h2>
<p>Use the <b>Explore</b> option to inspect the room. You can also climb onto the bed to close the ventilation grate you fell from.</p>
<h4>STEP 1: FIND THE QUANTRUNK</h4>
<p>Under the monitor there is a drawer with a blue touch screen: select it. The main character will open it with their fingertips, revealing a <b>quantrunk</b>, a container much bigger on the inside than on the outside. They will take the <b>earpiece</b> and the <b>watch</b> inside and put them on.</p>
<h4>STEP 2: MEET THE SHIP'S AI</h4>
<p>The earpiece connects you with the ship's artificial intelligence, whose memory units are damaged. Choose a name for it (default: <b>Chip</b>).</p>
<h4>STEP 3: ASK CHIP YOUR FIRST QUESTIONS</h4>
<p><b>Who am I?</b> Chip only recognizes you as <b>Subject261</b>; the rest of the data is corrupted. You can enter a name for your character.</p>
<p><b>Where are we?</b> Aboard a scientific spacecraft designed to explore and research new life forms. Almost all systems are dead: navigation, cameras and scanners are offline, so Chip recommends a manual check of the ship.</p>
<p><b>What's this trunk?</b> The quantrunk connects to your watch and lets you store unlimited objects. Oddly, it was locked to the captain's fingerprints... and it opened for you.</p>
<h4>STEP 4: THE WATCH</h4>
<p>When you finish the questions, Chip turns on your watch, unlocking the game's interface (the parameters screen). It also links to your brain so you can understand a million languages; from now on you can read the ship's screens and alerts.</p>
<h4>STEP 5: CHECK THE ROOM</h4>
<p>Read the <b>alert screens</b>: multiple systems are damaged, the ship has been boarded and the gun tray is empty. Look through the <b>window</b> to see where you are (and keep calm, or freak out). The <b>mirror</b> lets you rename your character or repeat the character configuration at any time. The <b>bathroom</b> lets you shower and clean up, and the <b>bed</b> lets you sleep to pass the time; more bed and TV options unlock as the story progresses.</p>
<hr>
<h2>PHASE 4: GET OUT OF THE CAPTAIN'S ROOM</h2>
<h4>STEP 1: FIX THE DOOR</h4>
<p>Select <b>Get out</b>. The door is stuck: the main character will pry open the metal panel to its right and, following Chip's instructions, rub two wires together to cause a short circuit. <em>Outcome:</em> <b>-5 Health</b> from the electric shock, but the door opens.</p>
<h4>STEP 2: EXPLORE THE SHIP</h4>
<p>You can now leave the Captain's Room and explore the rest of the spacecraft to find out what happened, kickstarting the quest to <b>repair the ship</b>. Once repaired, you will be able to lock and unlock your room's door.</p></template>
<template id="article-spaceship" data-slug="the-spaceship" data-title="The Spaceship: Complete Walkthrough Guide" data-desc="From the stuck door to landing on Akra Leuka: the ship, the engine puzzle, and meeting Rylan."><h2>PREREQUISITE</h2>
<p>Complete <em>Beginnings: Complete Walkthrough Guide</em> first: this guide starts the moment the stuck Captain's Room door opens. Playing on Easy difficulty lets you skip the engine puzzle in Phase 4.</p>
<h2>PHASE 1: FIRST STEPS ON DECK A</h2>
<h4>STEP 1: LEAVE THE CAPTAIN'S ROOM</h4>
<p>The main character steps out into Hallway A-0 and notices the door stays open. Chip, the ship's AI, explains they only unlocked it: a full repair would take a professional and spare parts. Choose <b>Ask if anyone is there</b> or <b>Be stealthy</b>; both are flavor only. A new diary page is added and the quest to reach solid ground begins.</p>
<h4>STEP 2: CHECK THE CREW ROOMS</h4>
<p>Try the first door on the left, the one with the orange light: <b>Put your finger on it</b> fails the fingerprint scan, and the doorbell gets no answer. Chip explains that private rooms have privacy protocols and that red lights mark rooms sealed for hull damage. The other doors on this deck read CLOSED FOR SAFETY.</p>
<h2>PHASE 2: SURVEY THE DAMAGE</h2>
<h4>STEP 1: GO DOWN TO DECKS B AND C</h4>
<p>The lower decks reveal blood, bullet holes and broken glass. Choose <b>Be confident</b>, <b>Stay calm</b> or <b>Freak out</b>: pure roleplay flavor with no stat effects.</p>
<h4>STEP 2: SEARCH THE LABORATORY (DECK B)</h4>
<p>The laboratory has been ransacked and two of its vats still hold twisted test subjects. When Chip compares their shared memory loss, choose carefully:</p>
<ul>
<li><b>It's not the same</b> → <span class="loss">-3 Chip Friendship</span></li>
<li><b>Right</b> → <span class="gain">+3 Chip Friendship</span></li>
</ul>
<p>Searching the room for memory units takes one hour and turns up nothing.</p>
<h4>STEP 3: THE REST OF THE SHIP</h4>
<ul>
<li><b>Therapy room (B-0):</b> books and unfamiliar drugs; nothing to take.</li>
<li><b>Workshop, Infirmary, Armory and Dormitories:</b> closed for safety until the ship lands.</li>
<li><b>Cells (C-0):</b> ten empty cells.</li>
<li><b>Cargo Bay (D-0):</b> empty crates, escape pods with only one missing, and looted spacesuit cabins. This is where the main character will leave the ship later.</li>
<li><b>Core (D-0):</b> sealed by hull damage. Chip explains the core controls every system on the ship.</li>
</ul>
<h2>PHASE 3: MEET RYLAN</h2>
<h4>STEP 1: THE LUNCHROOM AMBUSH</h4>
<p>Enter the lunchroom on deck C. Someone tackles the main character and pins them against a table (<span class="loss">-5 Health</span>). The attacker is Rylan, the ship's surviving soldier.</p>
<ul>
<li><b>Tell him the truth</b> or <b>Demand to be released</b>: flavor only.</li>
<li><b>Rub your ass against him</b> → <span class="gain">+1 Rylan Desire</span>. With a submissive main character, answer <b>You don't have what it takes</b> to turn the standoff into a heated encounter right on the table → <span class="gain">+3 Rylan Desire</span>, and the main character is left fully healed.</li>
<li><b>Try to break the hold</b>: fails, flavor only.</li>
</ul>
<h4>STEP 2: ANSWER HIS QUESTIONS</h4>
<p>The main character introduces themselves and Rylan is added to the Diary contacts. Choose <b>Tell him everything</b> or <b>Skip some of the details</b> about how they escaped (flavor only). Rylan shares a protein meal and his Talk menu opens. Exhaust it before moving on: it covers the pirate attack on the ship, unlocks the option to ask him for help with the engine, and is required before takeoff.</p>
<h2>PHASE 4: THE ENGINE ROOM</h2>
<h4>STEP 1: DIVERT POWER TO THE MAIN ENGINE</h4>
<p>Enter the engine room on deck D. Chip explains the fix: the steering engines still hold a 50% charge and power can be rerouted to the main engine by reconnecting the colored cables. Transfer as much power as possible without draining the side engines (keeping each at 10% is enough connecting cables in the wrong order causes a short circuit and undoes some of your work. Select <b>Mess with the cables</b> to play the wiring puzzle. You can leave it half-done and come back later.</p>
<p>If the result is below optimal, you can retry, ask Rylan for help (after meeting him), continue later, or insist on launching anyway against Chip's advice. On Easy difficulty, <b>Skip the puzzle</b> sets a perfect 80% charge instantly, but the game flags it: you will miss a Respect point after landing.</p>
<h4>STEP 2: KNOW YOUR ODDS</h4>
<p>The takeoff success chance depends on the main engine's final charge:</p>
<table><tbody><tr><th>Main engine charge</th><th>Success chance</th></tr><tr><td>80</td><td>99%</td></tr><tr><td>70</td><td>80%</td></tr><tr><td>60</td><td>50%</td></tr><tr><td>50</td><td>20% (Chip claims 1%)</td></tr><tr><td>Below 50</td><td>1%</td></tr></tbody></table></div>
<p>A failed jump is a <span class="loss">Game Over</span>: the ship is torn apart mid-jump. Save before launching.</p>
<h2>PHASE 5: THE FIRST JUMP</h2>
<h4>STEP 1: PREPARE FOR TAKEOFF</h4>
<p>Return to the bridge (hallway B-1) once the engine is patched. Chip refuses to launch until the main character has met everyone on board and is dressed for the trip: a full suit (armor and legs) and a helmet are required, and Rylan will send you back if anything is missing.</p>
<h4>STEP 2: LAUNCH</h4>
<p>The main character warns the crew over the PA and Rylan takes the co-pilot seat. If he is already interested (Desire 2 or more), he teases them before launch:</p>
<ul>
<li><b>The other way around</b> → <span class="gain">+1 Respect</span></li>
<li><b>No way</b> → no change</li>
<li><b>We'll see</b> → <span class="loss">-1 Respect</span></li>
</ul>
<p>Chip triangulates the ship's position from the stars, but the destination data is corrupted: the crew jumps blind. Press <b>Start</b>, aim the ship, then press <b>Curvature Propulsion</b>.</p>
<h4>STEP 3: THE MEMORY</h4>
<p>On a successful jump the main character passes out and relives a buried memory: leaving a dying Earth with their boyfriend before being cryogenized. Rylan wakes them up and fills in the history: Earth fell about 4,000 years ago, the escaped humans built Paradise, forced their own evolution into Meta-Humans, and now rule the galaxy with an iron fist.</p>
<h2>PHASE 6: LANDING ON AKRA LEUKA</h2>
<h4>STEP 1: TOUCHDOWN</h4>
<p>The ship reaches Akra Leuka, an independent city-state that draws its power from the black hole it orbits, and lands roughly on a lower-level parking lot. Two quests begin: <b>Repair the Ship</b> and <b>Hire a Pilot</b>.</p>
<h4>STEP 2: BECOME THE CAPTAIN</h4>
<p>Rylan names the main character captain and hands over the Captain's insignia, a cosmetic item. If the main character fixed the engine personally → <span class="gain">+1 Respect</span> (not if the puzzle was skipped on Easy). If Rylan had to fix it → <span class="loss">-1 Respect</span>. Rylan officially joins the crew.</p>
<h4>STEP 3: LEARN TO FIGHT</h4>
<p>Before leaving, Rylan insists on a combat tutorial in Hallway A-0: Akra is dangerous and the main character needs to know how to defend themselves. Follow his instructions to learn the basics.</p>
<h4>STEP 4: STEP OUTSIDE</h4>
<p>Go to the cargo bay and choose <b>Wait</b> to stay aboard or <b>Let's go</b> to leave. Rylan walks the main character through Akra's lower levels, a vertical megacity of neon signs, grime and open crime, then splits off to hunt for information about the pirates. The main character is free to explore the city from here. (To be continued in the Akra guide.)</p>
<h2>SUMMARY OF CHOICES AND STAT CHANGES</h2>
<table><tbody><tr><th>Character</th><th>Choice / Action</th><th>Effect</th></tr><tr><td>Chip</td><td>Laboratory: "It's not the same"</td><td><span class="loss">-3 Chip Friendship</span></td></tr><tr><td>Chip</td><td>Laboratory: "Right"</td><td><span class="gain">+3 Chip Friendship</span></td></tr><tr><td>Rylan</td><td>Lunchroom: tease him while pinned</td><td><span class="gain">+1 Rylan Desire</span></td></tr><tr><td>Rylan</td><td>Lunchroom: push the tease further (submissive MC)</td><td><span class="gain">+3 Rylan Desire</span> and a full heal</td></tr><tr><td>Rylan</td><td>Bridge: "The other way around"</td><td><span class="gain">+1 Respect</span></td></tr><tr><td>Rylan</td><td>Bridge: "We'll see"</td><td><span class="loss">-1 Respect</span></td></tr><tr><td>Rylan</td><td>Fix the engine yourself</td><td><span class="gain">+1 Respect</span></td></tr><tr><td>Rylan</td><td>Let Rylan fix the engine</td><td><span class="loss">-1 Respect</span></td></tr></tbody></table></div></template>
<script>
// ---------- starfield ----------
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');let W,H,stars=[];
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;
    stars=Array.from({length:Math.min(220,W*H/9000)},()=>({x:Math.random()*W,y:Math.random()*H,
      r:Math.random()*1.3+.2,s:Math.random()*.12+.02,tw:Math.random()*6.28}));}
  size();addEventListener('resize',size);
  (function tick(){x.clearRect(0,0,W,H);
    for(const st of stars){st.y+=st.s;st.tw+=.02;if(st.y>H){st.y=0;st.x=Math.random()*W;}
      x.globalAlpha=.35+.35*Math.sin(st.tw);
      x.fillStyle='#cfe6ff';x.beginPath();x.arc(st.x,st.y,st.r,0,6.29);x.fill();}
    x.globalAlpha=1;requestAnimationFrame(tick);})();
})();

// ---------- data ----------
const ARTICLES=[...document.querySelectorAll('template[id^="article-"]')].map(t=>({
  key:t.id.replace('article-',''),slug:t.dataset.slug,title:t.dataset.title,
  desc:t.dataset.desc,html:t.innerHTML}));
const ORDER=ARTICLES.map(a=>a.key);

// ---------- helpers ----------
const $=s=>document.querySelector(s);
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

function sectionsOf(a){
  // split article html into searchable sections by heading
  const tmp=document.createElement('div');tmp.innerHTML=a.html;
  const secs=[];let cur=null;
  tmp.childNodes.forEach(n=>{
    if(n.nodeType!==1)return;
    if(/^H[24]$/.test(n.tagName)){
      cur={tag:n.tagName,title:n.textContent.trim(),text:'',anchor:slugify(n.textContent)};secs.push(cur);
    }else if(cur){cur.text+=' '+n.textContent.trim();}
  });
  return secs;
}
const SEARCH_INDEX=[];
ARTICLES.forEach(a=>sectionsOf(a).forEach(s=>
  SEARCH_INDEX.push({article:a,anchor:s.anchor,title:s.title,text:(s.title+' '+s.text).toLowerCase()})));

// ---------- rendering ----------
function renderHome(){
  document.title='Lust Odyssey - Walkthrough Guide';
  const cards=ARTICLES.map((a,i)=>`
    <a class="card" href="#/guide/${a.slug}">
      <div class="cat">Walkthrough Guide · Part ${i+1}</div>
      <h2>${esc(a.title)}</h2>
      <p>${esc(a.desc)}</p>
      <span class="go">Read the guide →</span>
    </a>`).join('');
  return `
  <div class="hero">
    <div class="kicker">Official Walkthrough</div>
    <h1>LUST ODYSSEY<br>WALKTHROUGH GUIDE</h1>
    <p>Every phase, every step, every choice and its consequences - from the ventilation duct
    to the far reaches of space. Written from the game's own code, so nothing is left to guesswork.</p>
  </div>
  <div class="cards">${cards}</div>
  <p style="margin-top:34px;color:var(--muted);font-size:14px">More guides are on the way.
  Use <b style="color:var(--accent)">Search</b> (or press <kbd>/</kbd>) to jump straight to any choice, quest or character.</p>`;
}

function renderArticle(a){
  document.title=a.title+' - Lust Odyssey Walkthrough';
  const tmp=document.createElement('div');tmp.innerHTML=a.html;
  const toc=[];
  tmp.querySelectorAll('h2,h4').forEach(h=>{
    const id=slugify(h.textContent);h.id=(a.key)+'-'+id;
    if(h.tagName==='H2')toc.push({id:h.id,label:h.textContent.trim()});
  });
  const idx=ORDER.indexOf(a.key);
  const prev=idx>0?ARTICLES[idx-1]:null, next=idx<ORDER.length-1?ARTICLES[idx+1]:null;
  const phases=toc.length;
  const nav=`
    ${prev?`<a class="prev" href="#/guide/${prev.slug}">← Previous<small>${esc(prev.title)}</small></a>`:'<span></span>'}
    ${next?`<a class="next" href="#/guide/${next.slug}">Next →<small>${esc(next.title)}</small></a>`:''}`;
  return `
  <div class="crumbs"><a href="#/">Home</a> &nbsp;/&nbsp; Walkthrough Guide &nbsp;/&nbsp; ${esc(a.title)}</div>
  <div class="article-head">
    <h1>${esc(a.title)}</h1>
    <div class="meta"><span>🚀 Walkthrough Guide</span><span>📑 ${phases} sections</span><span>✍️ XperimentLO</span></div>
  </div>
  <div class="guide-body">${tmp.innerHTML}</div>
  <div class="article-foot">${nav}</div>`;
}

function renderSidebar(route){
  const links=ARTICLES.map(a=>
    `<a class="side-link ${route.article===a.key?'active':''}" href="#/guide/${a.slug}">${esc(a.title)}</a>`).join('');
  let toc='';
  if(route.article){
    const a=ARTICLES.find(x=>x.key===route.article);
    toc='<h3>On this page</h3><div class="toc">'+sectionsOf(a).filter(s=>s.tag==='H2')
      .map(s=>`<a href="#/guide/${a.slug}#${a.key}-${s.anchor}">${esc(s.title)}</a>`).join('')+'</div>';
  }
  return `<h3>Walkthrough Guide</h3>${links}${toc}`;
}

// ---------- router ----------
function route(){
  const h=location.hash||'#/';
  const m=h.match(/^#\/guide\/([a-z0-9-]+)(?:#(.+))?$/);
  const r={home:!m,article:null,anchor:null};
  if(m){const a=ARTICLES.find(x=>x.slug===m[1]);if(a){r.article=a.key;r.anchor=m[2]||null;}}
  $('#sidebar').innerHTML=renderSidebar(r);
  $('#content').innerHTML=r.article?renderArticle(ARTICLES.find(x=>x.key===r.article)):renderHome();
  $('#sidebar').classList.remove('open');
  if(r.anchor){const el=document.getElementById(r.anchor);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),30);}
  else scrollTo(0,0);
}
addEventListener('hashchange',route);

// ---------- search ----------
const overlay=$('#searchOverlay'),input=$('#searchInput'),results=$('#searchResults');
function openSearch(){overlay.classList.add('open');input.value='';runSearch('');input.focus();}
function closeSearch(){overlay.classList.remove('open');}
function runSearch(q){
  q=q.trim().toLowerCase();
  if(!q){results.innerHTML='<div class="search-empty">Type to search every phase, choice, quest and stat change.</div>';return;}
  const words=q.split(/\s+/);
  const hits=SEARCH_INDEX.filter(s=>words.every(w=>s.text.includes(w))).slice(0,12);
  if(!hits.length){results.innerHTML='<div class="search-empty">No results for “'+esc(q)+'”.</div>';return;}
  results.innerHTML=hits.map(h=>{
    const i=h.text.indexOf(words[0]);
    const raw=h.text.slice(Math.max(0,i-40),i+80);
    const snip=esc(raw).replace(new RegExp('('+words.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig'),'<mark>$1</mark>');
    return `<a class="sr" href="#/guide/${h.article.slug}#${h.article.key}-${h.anchor}">
      <div class="g">${esc(h.article.title)}</div><div class="t">${esc(h.title)}</div>
      <div class="s">…${snip}…</div></a>`;
  }).join('');
}
input.addEventListener('input',()=>runSearch(input.value));
overlay.addEventListener('click',e=>{if(e.target===overlay)closeSearch();});
results.addEventListener('click',e=>{if(e.target.closest('a'))closeSearch();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!overlay.classList.contains('open')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
});
$('#searchBtn').addEventListener('click',openSearch);
$('#burger').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));

route();
</script>
</body>
</html>
